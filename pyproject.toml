[project]
name = "code-review-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ahsaanjameel595", email = "ahsaanjameel595@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.2.4",
    "gitpython>=3.2.1",
    "langchain>=1.5.2",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langsmith>=0.16.0",
    "litellm>=1.110.2",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[project.scripts]
code-review-agent = "code_review_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
